name: Build Orbit Secure Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'secure-vpn/**'
      - '.github/workflows/orbit-secure-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-secure-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17 for libbox
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host project when absent
        working-directory: secure-vpn
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.orbitsecure --project-name orbit_secure .
            rm -f test/widget_test.dart
          fi

      - name: Set Android SDK levels (min 24, compile and target 36)
        working-directory: secure-vpn
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('android/app/build.gradle.kts')
          text = path.read_text()
          expected = 'minSdk = flutter.minSdkVersion'
          if expected not in text:
              raise SystemExit('Could not find Android minSdk declaration in generated Gradle file')
          text = text.replace(expected, 'minSdk = 24', 1)
          for key in ('compileSdk', 'targetSdk'):
              text, count = re.subn(rf'(?m)^(\s*{key}\s*=\s*).+$', rf'\g<1>36', text, count=1)
              if count != 1:
                  raise SystemExit(f'Could not set Android {key} to API 36 in generated Gradle file')
          path.write_text(text)
          PY

      - name: Keep local browser library out of Android Auto Backup
        working-directory: secure-vpn
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          if 'android:allowBackup=' not in text:
              text, count = re.subn(r'<application\b', '<application android:allowBackup="false"', text, count=1)
              if count != 1:
                  raise SystemExit('Could not find the Android application manifest element')
          elif 'android:allowBackup="false"' not in text:
              raise SystemExit('Android Auto Backup must remain disabled for the browser library')
          path.write_text(text)
          PY

      - name: Resolve Dart dependencies
        working-directory: secure-vpn
        run: flutter pub get

      - name: Patch legacy WebView Android R8 rule for current AGP
        working-directory: secure-vpn
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          cache = Path(os.environ.get('PUB_CACHE', Path.home() / '.pub-cache'))
          files = sorted(cache.glob('hosted/pub.dev/flutter_inappwebview_android-*/android/build.gradle'))
          if not files:
              raise SystemExit('Could not find flutter_inappwebview_android Gradle file in Pub cache')
          old = "getDefaultProguardFile('proguard-android.txt')"
          new = "getDefaultProguardFile('proguard-android-optimize.txt')"
          for path in files:
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new))
                  print(f'Patched obsolete R8 rule in {path}')
              elif new not in text:
                  raise SystemExit(f'Unexpected ProGuard configuration in {path}')
              else:
                  print(f'R8 rule is already compatible in {path}')
          PY

      - name: Build selected sing-box Hysteria2 Android core
        working-directory: secure-vpn
        run: dart run sing_box_flutter build --target android

      - name: Run parser and configuration tests
        working-directory: secure-vpn
        run: flutter test

      - name: Analyze Dart source
        working-directory: secure-vpn
        run: flutter analyze --no-fatal-infos

      - name: Set up Java 21 for Android release lint
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build installable release APKs per ABI
        working-directory: secure-vpn
        run: flutter build apk --release --split-per-abi

      - name: Verify release APK SDK metadata
        run: |
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$AAPT"
          count=0
          for apk in secure-vpn/build/app/outputs/flutter-apk/app-*-release.apk; do
            test -f "$apk"
            BADGING="$($AAPT dump badging "$apk")"
            echo "$BADGING" | grep -q "sdkVersion:'24'"
            echo "$BADGING" | grep -q "targetSdkVersion:'36'"
            echo "$BADGING" | grep -q "package: name='com.orbitsecure.orbit_secure'"
            SIZE="$(stat -c '%s' "$apk")"
            echo "$apk: minSdk 24, targetSdk 36, bytes $SIZE"
            count=$((count + 1))
          done
          test "$count" -eq 3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-secure-android-release-apks
          path: secure-vpn/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 30

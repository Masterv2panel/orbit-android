name: Build Orbit Secure Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'secure-vpn/**'
      - '.github/workflows/orbit-secure-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-secure-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host project when absent
        working-directory: secure-vpn
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.orbitsecure --project-name orbit_secure .
            rm -f test/widget_test.dart
          fi

      - name: Set Android minimum SDK required by the VPN engine
        working-directory: secure-vpn
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          text = path.read_text()
          expected = 'minSdk = flutter.minSdkVersion'
          if expected not in text:
              raise SystemExit('Could not find Android minSdk declaration in generated Gradle file')
          path.write_text(text.replace(expected, 'minSdk = 24', 1))
          PY

      - name: Resolve Dart dependencies
        working-directory: secure-vpn
        run: flutter pub get

      - name: Build selected sing-box Hysteria2 Android core
        working-directory: secure-vpn
        run: dart run sing_box_flutter build --target android

      - name: Run parser and configuration tests
        working-directory: secure-vpn
        run: flutter test

      - name: Analyze Dart source
        working-directory: secure-vpn
        run: flutter analyze

      - name: Build installable debug APK
        working-directory: secure-vpn
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-secure-android-apk
          path: secure-vpn/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

name: orbit_secure
description: A separate Android VPN prototype for Orbit, powered by sing-box Hysteria2.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sing_box_flutter: 0.3.1
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

sing_box_flutter:
  core:
    inbounds: [tun]
    outbounds: [hysteria2]
    dns: [udp]

flutter:
  uses-material-design: true
